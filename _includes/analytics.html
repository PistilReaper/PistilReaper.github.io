{% if site.google_analytics %}
	<!-- Google Analytics -->
	<script>
		(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		})(window,document,'script','//www.google-analytics.com/analytics.js','ga');

		ga('create', '{{ site.google_analytics }}', 'auto');
		ga('send', 'pageview', {
		  'page': '{{ site.baseurl }}{{ page.url }}',
		  'title': '{{ page.title | replace: "'", "\\'" }}'
		});
	</script>
	<!-- End Google Analytics -->
{% endif %}

{% if site.pageview and site.pageview.enabled %}
  <script>
    (function() {
      var storageKey = "{{ site.pageview.exclude_storage_key | default: 'pistil-pageview-excluded' }}";
      var toggleHash = "{{ site.pageview.toggle_hash | default: '#toggle-pageview-exclude' }}";
      var excluded = false;

      function readExcluded() {
        try {
          return window.localStorage.getItem(storageKey) === "true";
        } catch (error) {
          return false;
        }
      }

      function writeExcluded(value) {
        try {
          window.localStorage.setItem(storageKey, value ? "true" : "false");
        } catch (error) {
          return;
        }
      }

      excluded = readExcluded();

      if (window.location.hash === toggleHash) {
        excluded = !excluded;
        writeExcluded(excluded);

        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
        }

        window.setTimeout(function() {
          window.alert(
            excluded
              ? "当前浏览器已排除在浏览量统计之外。"
              : "当前浏览器已重新纳入浏览量统计。"
          );
        }, 0);
      }

      if (excluded) {
        window.__pistilPageviewExcluded = true;
        document.documentElement.classList.add("pageview-excluded");
        return;
      }

      var script = document.createElement("script");
      script.async = true;
      script.src = "{{ site.pageview.script_url | default: 'https://cdn.bootcdn.net/ajax/libs/busuanzi/2.3.0/bsz.pure.mini.js' }}";
      document.head.appendChild(script);

      function syncMirroredSitePv() {
        var sourceContainer = document.getElementById("busuanzi_container_site_pv");
        var sourceValue = document.getElementById("busuanzi_value_site_pv");
        var mirrors = document.querySelectorAll("[data-pageview-site-mirror]");

        if (!sourceValue || mirrors.length === 0) {
          return false;
        }

        var text = sourceValue.textContent.trim();
        if (!text) {
          return false;
        }

        for (var index = 0; index < mirrors.length; index += 1) {
          var mirror = mirrors[index];
          var mirrorValue = mirror.querySelector("[data-pageview-site-value]");

          if (!mirrorValue) {
            continue;
          }

          mirrorValue.textContent = text;
          mirror.style.display = sourceContainer && sourceContainer.style.display === "none" ? "none" : "inline";
        }

        return true;
      }

      var syncAttempts = 0;
      var syncTimer = window.setInterval(function() {
        syncAttempts += 1;

        if (syncMirroredSitePv() || syncAttempts >= 20) {
          window.clearInterval(syncTimer);
        }
      }, 500);
    })();
  </script>
{% endif %}
